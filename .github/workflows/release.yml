name: release

# After `test` goes green on main: tag + GitHub Release when version.rb carries a
# version that isn't tagged yet, and (idempotently, every time) point the
# Homebrew tap at the latest tagged release. Versions are still picked in the PR
# (the vX.Y.Z convention). Only main's tip ever acts, and a manual run also needs
# that tip's tests green, so a red or superseded commit never ships. Decisions
# and rendering live in packaging/release.rb (unit-tested); this file gathers facts.
on:
  workflow_run:
    workflows: [test]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # -eo pipefail: a failed command inside a pipe fails the step
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: '3.3'

      - name: Plan
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          sha="$(git rev-parse HEAD)"
          tip=false
          [ "$sha" = "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" ] && tip=true
          version="$(ruby packaging/release.rb version)"
          tagged=false
          git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null && tagged=true
          green=true
          if [ "$DISPATCH" = true ]; then
            [ "$(gh run list -w test -c "$sha" -L 1 --json conclusion --jq '.[0].conclusion')" = success ] || green=false
          fi
          plan="$(ruby packaging/release.rb plan "$tip" "$tagged" "$DISPATCH" "$green")"
          { echo "version=$version"; echo "$plan"; } >> "$GITHUB_OUTPUT"
          echo "::notice::v$version: $(sed -n 's/^reason=//p' <<<"$plan")"

      - name: Tag + GitHub Release
        if: steps.v.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          ruby packaging/release.rb notes "$VERSION" title.txt notes.md
          gh release create "v$VERSION" --target "$(git rev-parse HEAD)" --title "$(cat title.txt)" --notes-file notes.md

      # Idempotent, so it runs on every acting run: a failed push, or a token or
      # visibility change made after a release, heals on the next green main push
      # (or a manual run). The formula is rendered from the TAGGED template, so it
      # always matches the tarball it downloads. Brew needs the tarball public and
      # the push needs a PAT (contents:write on wvmitchell/homebrew-switchboard
      # only); either missing ⇒ skip, don't fail.
      - name: Update Homebrew tap
        if: steps.v.outputs.tap == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -u
          if [ "$(gh repo view "$GITHUB_REPOSITORY" --json isPrivate -q .isPrivate)" = "true" ]; then
            echo "::notice::repo is private; skipping the tap update (brew can't download a private tarball)"
            exit 0
          fi
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set; skipping the tap update for v$VERSION"
            exit 0
          fi
          tarball="$RUNNER_TEMP/switchboard.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" "$(ruby packaging/release.rb tarball-url "$VERSION")"
          sha="$(sha256sum "$tarball" | cut -d' ' -f1)"
          git fetch --no-tags origin "refs/tags/v$VERSION:refs/tags/v$VERSION"
          git show "v$VERSION:packaging/homebrew/switchboard.rb" > "$RUNNER_TEMP/formula.rb"

          # Auth as a per-command header so the PAT never lands in tap/.git/config;
          # mask the encoded form too, since GitHub only knows the raw secret.
          basic="$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          auth="AUTHORIZATION: basic $basic"
          git -c http.extraheader="$auth" clone https://github.com/wvmitchell/homebrew-switchboard.git tap
          branch="$(git -C tap symbolic-ref --short HEAD)" # the tap's default branch, which brew reads
          mkdir -p tap/Formula
          ruby packaging/release.rb formula "$VERSION" "$sha" "$RUNNER_TEMP/formula.rb" > tap/Formula/switchboard.rb
          git -C tap config user.name "github-actions[bot]"
          git -C tap config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C tap add Formula/switchboard.rb
          if git -C tap diff --cached --quiet; then
            echo "tap already at v$VERSION"
          else
            git -C tap commit -m "switchboard $VERSION"
            git -C tap -c http.extraheader="$auth" push origin "HEAD:$branch"
          fi
