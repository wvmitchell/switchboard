name: test

on:
  push:
  pull_request:
  # Weekly, with no push needed: catches drift outside the repo (a runner image
  # retired, a new setup-ruby/Ruby build) on a quiet week. Monday 10:17 UTC,
  # just before the morning monitor check reads it.
  schedule:
    - cron: '17 10 * * 1'

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The stdlib-Minitest suite on the documented floor (3.3, the oldest Ruby
        # still getting security fixes upstream — #35) and the newest release, the
        # one Homebrew's `ruby` hands formula installs. No `bundle install` — the
        # whole point is zero gem dependencies on a clean runner.
        include:
          - { ruby: '3.3', os: ubuntu-latest }
          - { ruby: '4.0', os: ubuntu-latest }
    name: ruby ${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: ${{ matrix.ruby }}
      - run: ruby bin/test

  # The real-tmux smoke layer (issue #104): boots an actual tmux server on an isolated
  # socket and drives the real binary through the create -> switch -> toggle -> new-window
  # -> close-pane -> quit lifecycle — the bug class the stubbed offline suite structurally
  # can't reach (#64 is the regression guard). A separate, BLOCKING job: real-tmux is too
  # slow for the inner loop, but a lifecycle regression should still turn the build red.
  # SMOKE_REQUIRE_TMUX=1 so a missing tmux fails loudly instead of silently passing.
  smoke:
    runs-on: ubuntu-latest
    name: smoke (real tmux)
    # A stalled apt mirror once hung this job; fail fast instead of GitHub's 6-hour default.
    timeout-minutes: 15
    env:
      SMOKE_REQUIRE_TMUX: "1"
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get -o Acquire::Retries=3 update && sudo apt-get -o Acquire::Retries=3 install -y tmux
        timeout-minutes: 5
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: '3.3'
      - run: ruby bin/test-smoke
